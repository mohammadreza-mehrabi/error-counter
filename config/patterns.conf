# ============================================
# patterns.conf — Attack detection patterns
# ============================================

# SQL Injection (CRITICAL)
SQLI_PATTERNS=(
    "'[[:space:]]*OR[[:space:]]*'?1'?[[:space:]]*=[[:space:]]*'?1"
    "UNION[[:space:]]+(ALL[[:space:]]+)?SELECT"
    ";[[:space:]]*DROP[[:space:]]+TABLE"
    "\\bSLEEP[[:space:]]*\\("
    "\\bBENCHMARK[[:space:]]*\\("
    "information_schema"
    "\\bLOAD_FILE[[:space:]]*\\("
    "\\bINTO[[:space:]]+OUTFILE"
    "\\bxp_cmdshell\\b"
)

# Command Injection (CRITICAL)
CMD_PATTERNS=(
    ";[[:space:]]*(cat|ls|id|whoami|uname|wget|curl|nc|bash|sh|python)\\b"
    "\\|[[:space:]]*(cat|ls|id|whoami|uname|wget|curl|nc|bash|sh|python)\\b"
    '\`[^\`]+\`'
    "\\$\\([^)]+\\)"
    "&&[[:space:]]*(cat|ls|id|whoami|uname)"
)

# Remote File Inclusion (CRITICAL)
RFI_PATTERNS=(
    "(=|%3[Dd])(https?|ftp)://[^/]"
    "php://filter"
    "php://input"
    "data://text"
    "expect://"
    "zip://"
    "phar://"
)

# Log4Shell (CRITICAL)
LOG4SHELL_PATTERNS=(
    "\\$\\{jndi:"
    "\\$\\{env:"
    "\\$\\{sys:"
    "\\$\\{date:"
    "\\$\\{ctx:"
)

# Shellshock (CRITICAL)
# Matches: () { :; }; <payload>
#         () { _; } >_[$($())] { echo vulnerable; }
# Note: In bash ERE, "()" is an empty group, NOT literal parens —
#       always escape as "\\(\\)" for literal matching.
SHELLSHOCK_PATTERNS=(
    "\\(\\)[[:space:]]*\\{[[:space:]]*[^}]*;"
)

# XSS (HIGH)
XSS_PATTERNS=(
    "<script[^>]*>"
    "javascript:[[:space:]]*"
    "onerror[[:space:]]*="
    "onload[[:space:]]*="
    "onclick[[:space:]]*="
    "<iframe[^>]*>"
    "<svg[^>]*onload"
    "<img[^>]*onerror"
    "document\\.cookie"
    "eval[[:space:]]*\\("
    "<body[^>]*onload"
)

# Path Traversal (HIGH)
TRAVERSAL_PATTERNS=(
    "\\.\\./"
    "\\.\\.\\\\"
    "\\.\\.%2[fF]"
    "%2[eE]%2[eE]%2[fF]"
    "/etc/passwd"
    "/etc/shadow"
    "/etc/hosts"
    "/proc/self"
    "windows/win\\.ini"
    "boot\\.ini"
)

# SSRF (HIGH)
SSRF_PATTERNS=(
    "(=|%3[Dd])(http://)?(127\\.0\\.0\\.1|localhost|0\\.0\\.0\\.0)"
    "(=|%3[Dd])http://169\\.254\\.169\\.254"
    "(=|%3[Dd])http://\\[::1\\]"
    "(=|%3[Dd])file://"
    "(=|%3[Dd])gopher://"
    "(=|%3[Dd])dict://"
)

# XXE (HIGH)
XXE_PATTERNS=(
    "<!ENTITY"
    "<!DOCTYPE[^>]+SYSTEM"
    "SYSTEM[[:space:]]+['\"]file://"
    "SYSTEM[[:space:]]+['\"]php://"
    "SYSTEM[[:space:]]+['\"]http://"
)

# NoSQL Injection (HIGH)
# Single quotes: no variable expansion. Patterns match literal $ne, $gt, etc.
NOSQL_PATTERNS=(
    '\$ne\b'
    '\$gt\b'
    '\$regex\b'
    '\$where\b'
    '\$or\b'
    '\[\$ne\]'
)

# SSTI (HIGH)
SSTI_PATTERNS=(
    "\\{\\{[^}]*\\}\\}"
    "\\{%[^%]*%\\}"
    "\\$\\{[^}]*\\}"
    "<%=.*%>"
    "#\\{.*\\}"
)

# Sensitive Files (MEDIUM)
SENSITIVE_PATTERNS=(
    "/\\.git/"
    "/\\.env"
    "/\\.htaccess"
    "/\\.htpasswd"
    "/wp-config\\.php"
    "/config\\.php"
    "/backup\\.sql"
    "/\\.aws/credentials"
    "/\\.ssh/id_"
    "/phpinfo\\.php"
    "/server-status"
    "/\\.svn/"
)

# CRLF Injection (MEDIUM)
CRLF_PATTERNS=(
    "%0[dD]%0[aA]"
    "%0[aA]"
    "%250[dD]"
)

# Open Redirect (LOW)
OPENREDIR_PATTERNS=(
    "(url|redirect|next|return|goto)=https?://"
    "(url|redirect|next|return|goto)=//"
)

# Scanner User-Agents (INFO)
# Anchored with (^|[^alnum]) ... ([^alnum]|$) to avoid substring FPs
# (e.g. "Zapier" ≠ ZAP, "unmapped" ≠ nmap, "dirbased" ≠ dirb).
# Multi-word scanners use explicit patterns.
SCANNER_USER_AGENTS=(
    "(^|[^[:alnum:]])sqlmap([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])nikto([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])nmap([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])masscan([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])dirbuster([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])gobuster([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])wfuzz([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])nuclei([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])acunetix([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])nessus([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])openvas([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])hydra([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])medusa([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])w3af([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])skipfish([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])whatweb([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])wpscan([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])dirb([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])ffuf([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])zap([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])Burp[ _-]?Suite([^[:alnum:]]|$)"
    "(^|[^[:alnum:]])burpsuite([^[:alnum:]]|$)"
)

# Severity weights
declare -A CATEGORY_SEVERITY=(
    [sqli]=10
    [cmd]=10
    [rfi]=10
    [log4shell]=10
    [shellshock]=10
    [xss]=7
    [traversal]=7
    [ssrf]=7
    [xxe]=7
    [nosql]=7
    [ssti]=7
    [sensitive]=4
    [crlf]=4
    [openredir]=2
    [scanner]=1
)

